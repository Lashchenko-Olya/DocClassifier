<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Класифікатор Документів</title>
    <style>
        body {
            background-color: #2c2826;
            color: #e3d5ca;
            font-family: 'Georgia', serif;
            text-align: center;
            padding: 50px;
        }

        .container {
            border: 2px solid #8b5a2b;
            padding: 30px;
            border-radius: 10px;
            max-width: 600px;
            margin: auto;
            background-color: #3b3531;
            box-shadow: 5px 5px 15px rgba(0, 0, 0, 0.5);
        }

        textarea {
            width: 90%;
            height: 150px;
            margin-top: 15px;
            padding: 10px;
            background-color: #e3d5ca;
            border: 2px solid #8b5a2b;
            border-radius: 5px;
            font-family: inherit;
            font-size: 16px;
            color: #2c2826;
            resize: none;
        }

        button {
            margin-top: 20px;
            padding: 10px 25px;
            background-color: #8b5a2b;
            color: #e3d5ca;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: #a06b35;
        }

        #result {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
        }

        .error {
            color: #ff6b6b;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Категоризація Документів</h1>
        <p>Введіть текст службового документа (наприклад, фрагмент наказу, заяви чи листа):</p>

        <textarea id="docText" placeholder="Введіть текст сюди..."></textarea><br>
        <button onclick="classifyDocument()">Визначити категорію</button>

        <div id="result"></div>
    </div>

    <script>
        async function classifyDocument() {
            const text = document.getElementById('docText').value;
            const resultDiv = document.getElementById('result');

            // Базова перевірка, щоб не слати пусті запити
            if (text.trim() === '') {
                resultDiv.innerHTML = '<span class="error">Помилка: Введіть хоча б якийсь текст!</span>';
                return;
            }

            resultDiv.innerText = 'Аналізую...';

            try {
                // Відправляємо текст на наш сервер
                const response = await fetch('/classify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: text })
                });

                const data = await response.json();

                if (response.ok) {
                    resultDiv.innerHTML = `Категорія документа: <span style="color: #4CAF50;">${data.category}</span>`;
                } else {
                    resultDiv.innerHTML = `<span class="error">Помилка: ${data.error}</span>`;
                }
            } catch (error) {
                resultDiv.innerHTML = '<span class="error">Помилка з\'єднання з сервером</span>';
            }
        }
    </script>
</body>

</html>
